<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookmark Sync 设置</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 16px;
        font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 { margin: 0 0 16px; font-size: 18px; }
      form { display: grid; gap: 12px; }
      label { display: grid; gap: 4px; font-weight: 600; }
      input, select { padding: 6px 8px; font: inherit; font-weight: 400; }
      .hint { margin: 0; color: #6b7280; font-size: 12px; }
      .actions { display: flex; gap: 8px; margin-top: 4px; }
      button { padding: 7px 14px; font: inherit; }
      #result { min-height: 1.6em; margin: 0; }
      #result.ok { color: #0a7d33; }
      #result.bad { color: #b3261e; }
    </style>
  </head>
  <body>
    <h1>Bookmark Sync 设置</h1>
    <form id="settings-form">
      <label>
        中继地址
        <input id="relay-url" type="text" placeholder="ws://127.0.0.1:8787/ws" autocomplete="off" spellcheck="false" />
      </label>
      <label>
        令牌
        <input id="token" type="password" autocomplete="off" spellcheck="false" />
      </label>
      <label>
        浏览器
        <select id="browser">
          <option value="chrome">Chrome</option>
          <option value="ego">ego lite</option>
        </select>
      </label>
      <label>
        Profile 名称
        <input id="profile-label" type="text" placeholder="default" autocomplete="off" spellcheck="false" />
      </label>
      <p class="hint">ego 有多个 Profile 时，只在准备参与同步的那个 Profile 里安装并配置本扩展。</p>
      <p class="hint">端点 ID：<span id="endpoint-preview">—</span></p>
      <div class="actions">
        <button type="submit">保存</button>
        <button type="button" id="test-connection">测试连接</button>
        <button type="button" id="reset-sync">重置同步状态</button>
      </div>
      <p id="result"></p>
    </form>
    <script type="module" src="options.js"></script>
  </body>
</html>
